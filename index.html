<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Membership Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <!-- Link to external Python script -->
    <script type="py" src="./main.py"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 45px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">ICT Club Membership Portal</h2>
                        <p class="text-muted">Add a new student member to the master club roster</p>
                    </div>

                    <!-- Input Fields for First Name & Last Name-->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first-name" class="form-label fw-semibold">First Name</label>
                            <input type="text" id="first-name" class="form-control" placeholder="Enter first name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last-name" class="form-label fw-semibold">Last Name</label>
                            <input type="text" id="last-name" class="form-control" placeholder="Enter last name">
                        </div>
                    </div>

                    <!-- Button triggering PyScript function-->
                    <div class="d-grid mt-3">
                        <button py-click="add_new_member" class="btn btn-primary btn-lg fw-semibold">Add Member & Update Roster</button>
                    </div>

                    <!-- Output Result Area -->
                    <div class="mt-4">
                        <div id="result" class="p-4 rounded border bg-light">
                            <em class="text-muted">Enter a name above and click the button to show the full club list.</em>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
