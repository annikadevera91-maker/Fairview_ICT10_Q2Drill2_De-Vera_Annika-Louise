<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Membership Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 45px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">ICT Club Membership Portal</h2>
                        <p class="text-muted">Add a new student member to the master club roster</p>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first-name" class="form-label fw-semibold">First Name</label>
                            <input type="text" id="first-name" class="form-control" placeholder="Enter first name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last-name" class="form-label fw-semibold">Last Name</label>
                            <input type="text" id="last-name" class="form-control" placeholder="Enter last name">
                        </div>
                    </div>

                    <div class="d-grid mt-3">
                        <button py-click="add_new_member" class="btn btn-primary btn-lg fw-semibold">Add Member & Update Roster</button>
                    </div>

                    <div class="mt-4">
                        <div id="result" class="p-4 rounded border bg-light">
                            <em class="text-muted">Enter a name above and click the button to show the full club list.</em>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="py">
from pyscript import document

# Predefine sets representing grade levels
grade_7_members = {"Gavin Ruiz", "Edrian Correa", "Philip Ponce"}
grade_8_members = {"Julian Anaque", "Andrik David", "Annika De Vera"}
grade_9_members = {"Eliana Daet", "Zecca Zeppola", "Tic Toc Tortora"}
grade_10_members = {"Ratio Randall", "Coccinella Cotoletta", "Farfallina Farfallona"}

def add_new_member(event):
    fname = document.querySelector("#first-name").value.strip()
    lname = document.querySelector("#last-name").value.strip()
    
    new_member_set = {f"{fname} {lname}".title()}

    # Combine sets using union operator
    master_club_set = grade_7_members | grade_8_members | grade_9_members | grade_10_members | new_member_set
    master_club_set = master_club_set - {" "}

    formatted_members_list = "<br>".join(sorted(master_club_set))
    total_members_count = len(master_club_set)

    output_html = f"""
    <h5 class="fw-bold text-success mb-3">Master Club Roster Updated</h5>
    <p class="mb-2"><strong>Total Number of Members:</strong> <span class="badge bg-primary fs-6">{total_members_count}</span></p>
    <div class="mt-3">
        <strong>Full List of Members:</strong>
        <div class="p-3 mt-2 bg-white rounded border font-monospace text-dark">
            {formatted_members_list}
        </div>
    </div>
    """

    document.querySelector("#result").innerHTML = output_html
    </script>

</body>
</html>
